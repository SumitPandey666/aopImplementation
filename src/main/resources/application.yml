spring:
  application:
    name: aop-crud-impl

  config:
    import: vault://

  cloud:
    bootstrap:
      enabled: false

    vault:
      uri: http://127.0.0.1:8200
      scheme: http
      token: ${VAULT_TOKEN}

      kv:
        enabled: true
        backend: secret
#        application-name: db
        default-context: db

  datasource:
    url: jdbc:mysql://localhost:3306/aop_crud_db
#    username: ${username}
#    password: ${password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

debug: true

